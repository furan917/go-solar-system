name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release e.g v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build assets
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/go-solar-system-linux-amd64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/go-solar-system-linux-arm64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/go-solar-system-windows-amd64.exe
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o dist/go-solar-system-darwin-amd64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o dist/go-solar-system-darwin-arm64

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: dist/*
          fail_on_unmatched_files: true
